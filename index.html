<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="First-pass solar PV + battery sizing with transparent formulas and live PVGIS data.">
<link rel="icon" href="data:,">
<title>Solar PV + battery sizing calculator</title>
<style>
  :root{
    --green:#1D9E75;   --green-bg:#E8F6F0;  --green-line:#BFE6D7;
    --red:#E24B4A;     --red-bg:#FBEAEA;    --red-line:#F3C7C6;
    --blue:#378ADD;    --blue-bg:#EAF2FC;   --blue-line:#C4DEF7;
    --orange:#C97A1E;  --orange-bg:#FCF1E1; --orange-line:#F0D6AC;
    --ink:#1A1D1F; --ink-soft:#5B6168; --ink-faint:#8A9097;
    --line:#E2E5E9; --bg:#F4F5F6; --card:#FFFFFF;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--ink);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}

  /* ---------- header ---------- */
  header.top{padding:8px 0 22px;border-bottom:1px solid var(--line);margin-bottom:22px;}
  header.top h1{font-size:1.55rem;font-weight:800;letter-spacing:-0.01em;margin:0 0 6px;}
  header.top p{margin:0;color:var(--ink-soft);font-size:0.92rem;max-width:760px;}
  .badge-estimate{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--blue-bg);color:#1F5FA8;border:1px solid var(--blue-line);
    font-size:0.74rem;font-weight:600;padding:3px 9px;border-radius:999px;margin-top:10px;
  }

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 20px;
  }
  .card + .card{margin-top:18px;}
  .card h2{font-size:0.98rem;font-weight:700;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .card h2 .num{
    font-family:var(--mono);font-size:0.72rem;font-weight:700;color:var(--ink-faint);
    border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  }

  .controls-card{position:sticky;top:16px;}
  @media (max-width:900px){.controls-card{position:static;}}

  /* ---------- form controls ---------- */
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:0.82rem;font-weight:600;color:var(--ink);margin-bottom:6px;
  }
  .field label .val{
    font-family:var(--mono);font-weight:700;color:var(--blue);
    background:var(--blue-bg);border-radius:5px;padding:1px 7px;font-size:0.8rem;
  }
  .field .note{font-size:0.72rem;color:var(--ink-faint);margin-top:5px;}
  select, input[type=number]{
    width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;
    font-family:var(--sans);font-size:0.88rem;color:var(--ink);background:#fff;
  }
  input[type=range]{
    width:100%;height:4px;border-radius:3px;background:var(--line);
    outline:none;-webkit-appearance:none;appearance:none;margin:4px 0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:17px;height:17px;border-radius:50%;
    background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--blue);cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:17px;height:17px;border-radius:50%;background:var(--blue);
    border:2px solid #fff;box-shadow:0 0 0 1px var(--blue);cursor:pointer;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0;}
  .subhead{font-size:0.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin:0 0 10px;}

  /* ---------- computed (auto) readout ---------- */
  .computed-note{
    font-size:0.78rem;background:var(--blue-bg);border:1px solid var(--blue-line);
    border-radius:7px;padding:9px 11px;margin-bottom:16px;color:#1F5FA8;
  }
  .computed-note strong{font-family:var(--mono);font-weight:800;}

  /* ---------- verdict banner ---------- */
  .verdict{
    border-radius:var(--radius);padding:20px;border:1px solid;display:flex;gap:16px;align-items:center;
    flex-wrap:wrap;
  }
  .verdict.green{background:var(--green-bg);border-color:var(--green-line);}
  .verdict.red{background:var(--red-bg);border-color:var(--red-line);}
  .verdict .icon{font-size:2rem;line-height:1;}
  .verdict .text{flex:1;min-width:220px;}
  .verdict .text h3{margin:0 0 4px;font-size:1.18rem;font-weight:800;letter-spacing:-0.01em;}
  .verdict.green h3{color:#136B4E;}
  .verdict.red h3{color:#962323;}
  .verdict .text p{margin:0;font-size:0.86rem;color:var(--ink-soft);}

  /* ---------- metric cards ---------- */
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px;}
  @media (max-width:760px){.metrics{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:480px){.metrics{grid-template-columns:1fr;}}
  .metric{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 16px;
  }
  .metric .mlabel{font-size:0.72rem;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .metric .mvalue{font-family:var(--mono);font-size:1.5rem;font-weight:800;margin:4px 0 2px;color:var(--ink);}
  .metric .msub{font-size:0.74rem;color:var(--ink-soft);}

  /* ---------- formula disclosure ---------- */
  details.formula{margin-top:10px;}
  details.formula summary{
    cursor:pointer;font-size:0.74rem;color:var(--blue);font-weight:600;list-style:none;
    display:inline-flex;align-items:center;gap:4px;user-select:none;
  }
  details.formula summary::-webkit-details-marker{display:none;}
  details.formula summary::before{content:'▸';font-size:0.65rem;transition:transform .15s ease;}
  details.formula[open] summary::before{transform:rotate(90deg);}
  .formula-body{
    margin-top:8px;padding:10px 12px;background:#FAFBFC;border:1px solid var(--line);
    border-radius:7px;font-size:0.78rem;
  }
  .f-line{display:flex;gap:8px;padding:3px 0;flex-wrap:wrap;}
  .f-label{color:var(--ink-faint);min-width:62px;flex-shrink:0;font-weight:600;}
  .f-mono{font-family:var(--mono);color:var(--ink);word-break:break-word;}
  .f-result{color:var(--green);font-weight:700;}

  /* ---------- chart ---------- */
  .chart-wrap{height:320px;position:relative;}

  /* ---------- table ---------- */
  table.monthly{width:100%;border-collapse:collapse;font-size:0.82rem;}
  table.monthly th, table.monthly td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
  table.monthly th{font-size:0.7rem;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-faint);font-weight:700;}
  table.monthly td.num{font-family:var(--mono);text-align:right;}
  table.monthly tr:last-child td{border-bottom:none;}
  .status-pill{
    display:inline-block;padding:2px 9px;border-radius:999px;font-size:0.72rem;font-weight:700;
  }
  .status-pill.ok{background:var(--green-bg);color:var(--green);}
  .status-pill.bad{background:var(--red-bg);color:var(--red);}
  .tbl-scroll{overflow-x:auto;}

  /* ---------- battery steps ---------- */
  .steps{display:flex;flex-direction:column;gap:10px;}
  .step{
    display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#FAFBFC;
    border:1px solid var(--line);border-radius:8px;
  }
  .step .sidx{
    font-family:var(--mono);font-weight:800;font-size:0.78rem;color:#fff;background:var(--blue);
    width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .step .scontent{flex:1;}
  .step .stitle{font-size:0.84rem;font-weight:700;margin-bottom:2px;}
  .step .sval{font-family:var(--mono);font-size:0.9rem;font-weight:700;color:var(--blue);}
  .step.yes .sidx{background:var(--green);}
  .step.no .sidx{background:var(--red);}

  footer.note{
    margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
    font-size:0.74rem;color:var(--ink-faint);
  }

  /* ---------- v2 additions ---------- */
  header.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap;}
  header.top .htext{flex:1;min-width:260px;}
  .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px;}
  .seg button{
    font-family:var(--sans);font-size:0.8rem;font-weight:700;padding:9px 8px;border:none;background:#fff;color:var(--ink-soft);cursor:pointer;
  }
  .seg button + button{border-left:1px solid var(--line);}
  .seg button.active{background:var(--blue);color:#fff;}
  .seg button:focus-visible,.btn:focus-visible,.lang button:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .mode-note{font-size:0.74rem;color:var(--ink-faint);margin:0 0 4px;}
  body[data-mode="size"] .check-only{display:none;}
  body[data-mode="check"] .size-only{display:none;}
  .checkbox{display:flex;gap:6px;align-items:center;font-size:0.74rem;color:var(--ink-soft);margin-top:6px;font-weight:500;}
  .checkbox input{margin:0;}
  input[type=number]:disabled{background:var(--bg);color:var(--ink-faint);}
  .verdict.info{background:var(--blue-bg);border-color:var(--blue-line);}
  .verdict.info h3{color:#1F5FA8;}
  .btn{
    font-family:var(--sans);font-size:0.82rem;font-weight:700;padding:9px 14px;border-radius:8px;
    border:1px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;
  }
  .btn:hover{background:var(--blue);color:#fff;}
  .step.na .sidx{background:var(--ink-faint);}
  .step .note{font-size:0.72rem;color:var(--ink-faint);margin-top:4px;}
  .sval.small{font-size:0.82rem;display:block;}
  .smsg{margin-top:5px;font-size:0.82rem;font-weight:700;}
  .source{font-size:0.76rem;border-radius:7px;padding:8px 10px;margin-top:8px;border:1px solid;}
  .source.offline{background:var(--orange-bg);border-color:var(--orange-line);color:#7A4A10;}
  .source.live{background:var(--green-bg);border-color:var(--green-line);color:#136B4E;}
  .source.loading{background:var(--bg);border-color:var(--line);color:var(--ink-soft);}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;}
  .lang button{font-family:var(--mono);font-size:0.76rem;font-weight:700;padding:6px 11px;border:none;background:#fff;color:var(--ink-soft);cursor:pointer;}
  .lang button + button{border-left:1px solid var(--line);}
  .lang button.active{background:var(--ink);color:#fff;}
  .tip{cursor:help;color:var(--blue);font-weight:700;}
  .note.standalone{font-size:0.72rem;color:var(--ink-faint);margin:-8px 0 14px;}
  .step .scontent{font-size:0.84rem;}
  body:not([data-custom="1"]) .custom-only{display:none;}
  #sourceNote .note{font-size:0.72rem;color:var(--ink-faint);margin-top:5px;}
</style>
</head>
<body data-mode="size">
<div class="wrap">

  <header class="top">
    <div class="htext">
      <h1>☀️ <span data-i18n="title"></span></h1>
      <p data-i18n="subtitle"></p>
      <span class="badge-estimate" data-i18n="badge"></span>
    </div>
    <div class="lang" role="group" data-i18n-title="langLabel">
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="mk" aria-pressed="false">МК</button>
    </div>
  </header>

  <div class="layout">

    <!-- ============ CONTROLS ============ -->
    <div class="controls-card card" id="controls">
      <h2 data-i18n="params"></h2>

      <div class="seg" role="group">
        <button type="button" id="modeSize" class="active" aria-pressed="true" data-i18n="modeSize"></button>
        <button type="button" id="modeCheck" aria-pressed="false" data-i18n="modeCheck"></button>
      </div>
      <p class="mode-note" id="modeNote"></p>

      <hr class="sep">
      <p class="subhead" data-i18n="secLocation"></p>
      <div class="field">
        <label for="city" data-i18n="city"></label>
        <select id="city"></select>
        <div class="note" id="cityCoords"></div>
      </div>
      <div class="row2 custom-only">
        <div class="field">
          <label for="lat" data-i18n="lat"></label>
          <input type="number" id="lat" min="-90" max="90" step="0.01" value="41.99">
        </div>
        <div class="field">
          <label for="lng" data-i18n="lng"></label>
          <input type="number" id="lng" min="-180" max="180" step="0.01" value="21.43">
        </div>
      </div>
      <div class="field">
        <div id="sourceNote"></div>
      </div>

      <hr class="sep">
      <p class="subhead" data-i18n="secSystem"></p>
      <div class="field">
        <label for="wp" data-i18n="panelWp"></label>
        <input type="number" id="wp" min="50" max="1000" step="5" value="590">
      </div>
      <div class="field check-only">
        <label for="panels" data-i18n="panelsInstalled"></label>
        <input type="number" id="panels" min="0" step="1" value="12">
      </div>
      <div class="computed-note size-only" id="panelsComputedNote"></div>
      <div class="field">
        <label for="tilt"><span data-i18n="tilt"></span> <span class="val" id="tiltVal"></span></label>
        <input type="range" id="tilt" min="0" max="90" step="1" value="34">
        <div class="note" data-i18n="tiltNote"></div>
      </div>
      <div class="field">
        <label for="azimuth"><span data-i18n="azimuth"></span> <span class="val" id="azimuthVal"></span></label>
        <input type="range" id="azimuth" min="0" max="359" step="1" value="180">
        <div class="note" data-i18n="azimuthNote"></div>
      </div>

      <hr class="sep">
      <p class="subhead" data-i18n="secConsumption"></p>
      <div class="field">
        <label for="consumption" data-i18n="consumption"></label>
        <input type="number" id="consumption" min="0" step="0.5" value="18">
      </div>
      <div class="field">
        <label for="peakLoad" data-i18n="peakLoad"></label>
        <input type="number" id="peakLoad" min="0" step="0.5" value="5">
        <div class="note" data-i18n="peakLoadNote"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="nightStart" data-i18n="nightStart"></label>
          <select id="nightStart"></select>
        </div>
        <div class="field">
          <label for="nightEnd" data-i18n="nightEnd"></label>
          <select id="nightEnd"></select>
        </div>
      </div>
      <div class="note standalone" data-i18n="nightWindowNote"></div>
      <div class="field">
        <label for="nightShare" data-i18n="nightShare"></label>
        <input type="number" id="nightShare" min="0" max="100" step="1" value="62.5" disabled>
        <label class="checkbox"><input type="checkbox" id="nightShareAuto" checked> <span data-i18n="nightShareAuto"></span></label>
      </div>

      <hr class="sep">
      <p class="subhead" data-i18n="secBattery"></p>
      <div class="field check-only">
        <label for="batteryKwh" data-i18n="batteryInstalled"></label>
        <input type="number" id="batteryKwh" min="0" step="0.1" value="10">
      </div>
      <div class="field">
        <label for="dod"><span data-i18n="dod"></span> <span class="val" id="dodVal"></span></label>
        <input type="range" id="dod" min="50" max="100" step="1" value="95">
      </div>
      <div class="field">
        <label for="eff"><span data-i18n="efficiency"></span> <span class="val" id="effVal"></span></label>
        <input type="range" id="eff" min="70" max="100" step="1" value="92">
        <div class="note" data-i18n="efficiencyNote"></div>
      </div>
      <div class="field">
        <label for="autonomy"><span data-i18n="autonomy"></span> <span class="val" id="autonomyVal"></span></label>
        <input type="range" id="autonomy" min="0" max="3" step="1" value="1">
        <div class="note" data-i18n="autonomyNote"></div>
      </div>

      <hr class="sep">
      <p class="subhead" data-i18n="secInverter"></p>
      <div class="field">
        <label for="dcAc" data-i18n="dcAc"></label>
        <input type="number" id="dcAc" min="0.8" max="1.6" step="0.05" value="1.2">
        <div class="note" data-i18n="dcAcNote"></div>
      </div>
    </div>

    <!-- ============ RESULTS ============ -->
    <div class="results">
      <div id="verdictBox"></div>

      <div class="card">
        <h2><span class="num">✓/✗</span> <span id="checksTitle"></span></h2>
        <div class="steps" id="verdictChecks"></div>
      </div>

      <div class="metrics" id="metricsBox"></div>

      <div class="card">
        <h2><span class="num">①</span> <span data-i18n="chartTitle"></span></h2>
        <div class="chart-wrap" id="monthlyChart"></div>
      </div>

      <div class="card">
        <h2><span class="num">②</span> <span data-i18n="tableTitle"></span></h2>
        <div class="tbl-scroll">
          <table class="monthly">
            <thead>
              <tr><th data-i18n="thMonth"></th><th style="text-align:right" data-i18n="thProd"></th><th style="text-align:right" data-i18n="thCons"></th><th style="text-align:right" data-i18n="thDaily"></th><th style="text-align:right" data-i18n="thBalance"></th><th data-i18n="thStatus"></th></tr>
            </thead>
            <tbody id="monthlyTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2><span class="num">③</span> <span data-i18n="stepsTitle"></span></h2>
        <div class="steps" id="batterySteps"></div>
      </div>
    </div>
  </div>

  <footer class="note" data-i18n="footer"></footer>
</div>

<script>
  // Chromium blocks ES modules on file:// URLs. When opened from disk, load the
  // prebuilt classic bundle (npm run bundle); otherwise load the ES modules.
  (function () {
    var s = document.createElement('script');
    if (location.protocol === 'file:') {
      s.src = 'dist/app.bundle.js';
    } else {
      s.type = 'module';
      s.src = 'src/ui.js';
    }
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
